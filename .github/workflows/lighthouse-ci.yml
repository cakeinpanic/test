name: Lighthouse CI

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering
  push:
jobs:
  lighthouse-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

#      - name: Run Lighthouse
#        id: lighthouse
#        uses: treosh/lighthouse-ci-action@v10
#        with:
#          urls: |
#            https://lido.fi/
#          configPath: '.lighthouserc.js'
#          uploadArtifacts: true

      - name: run lhci
        run: |
          npm install -g @lhci/cli@0.12.0
          lhci collect --config .lighthouserc.js

      - name: Create .env file from GitHub secrets
        run: |
          echo "BOT_TOKEN=${{ secrets.TG_ALERT_BOT_TOKEN }}" > .env
          echo "TG_ALERT_CHANEL_ID=${{ secrets.TG_ALERT_CHANEL_ID }}" >> .env
        

      - name: Send Lighthouse report to Telegram
        run: |
          # Run the script with Node.js
          node --experimental-modules ./send-telegram-report.mjs
